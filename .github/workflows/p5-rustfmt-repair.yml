name: P5 Rustfmt Repair

on:
  push:
    branches:
      - implementation/p5-candidate-space-bounded-discovery
    paths:
      - '.github/workflows/p5-rustfmt-repair.yml'
      - '**/*.rs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: implementation/p5-candidate-space-bounded-discovery
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Apply canonical rustfmt
        run: cargo fmt --all

      - name: Commit formatter output when required
        shell: bash
        run: |
          if git diff --quiet -- '*.rs'; then
            echo 'No Rust formatting changes required.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style(p5): apply canonical rustfmt'
          git push origin HEAD:implementation/p5-candidate-space-bounded-discovery
