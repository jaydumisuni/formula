name: P12 rustfmt apply

on:
  push:
    branches:
      - tooling/p12-rustfmt-export-20260906

permissions:
  contents: write

jobs:
  format-apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical P12 branch
        uses: actions/checkout@v4
        with:
          ref: implementation/p12-self-hosting-bootstrap-trust-reduction
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Bind final verifier into canonical integration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/formula-first-light/tests/p12_bootstrap_trust_reduction.rs')
          text = path.read_text()

          old_import = '''use formula_check::bootstrap::{
              BootstrapValidationFailure, canonical_build_recipe_identity,
              canonical_normalization_rules_identity, reference_compile, semantic_evidence_identity,
              validate_bootstrap_candidate,
          };
          '''
          new_import = '''use formula_check::{
              bootstrap::{
                  BootstrapValidationFailure, canonical_build_recipe_identity,
                  canonical_normalization_rules_identity, reference_compile, semantic_evidence_identity,
                  validate_bootstrap_candidate,
              },
              bootstrap_verifier::{
                  BootstrapReplayEvidence, P12_CANONICAL_MARKERS, verify_bootstrap_proof_manifest,
              },
          };
          '''
          assert text.count(old_import) == 1, 'formula_check import anchor changed'
          text = text.replace(old_import, new_import, 1)

          old_controls = '    let negative_controls = BootstrapNegativeControlManifest::new(negatives).unwrap();\n'
          new_controls = '    let negative_controls = BootstrapNegativeControlManifest::new(negatives.clone()).unwrap();\n'
          assert text.count(old_controls) == 1, 'negative controls anchor changed'
          text = text.replace(old_controls, new_controls, 1)

          old_stages = '        stage1_rebuild,\n        stage2_rebuild,\n'
          new_stages = '        stage1_rebuild.clone(),\n        stage2_rebuild.clone(),\n'
          assert text.count(old_stages) == 1, 'stage rebuild ownership anchor changed'
          text = text.replace(old_stages, new_stages, 1)

          old_manifest_controls = '        negative_controls,\n        u_before,\n'
          new_manifest_controls = '        negative_controls.clone(),\n        u_before,\n'
          assert text.count(old_manifest_controls) == 1, 'proof control ownership anchor changed'
          text = text.replace(old_manifest_controls, new_manifest_controls, 1)

          marker = '    println!("P12_SOURCE_COMMIT={}", source_commit());\n'
          assert text.count(marker) == 1, 'identity emission marker changed'
          replay = '''    let replay = BootstrapReplayEvidence::new(
              proof.structural_digest(),
              source_commit().into(),
              p11_frozen_proof_identity(),
              seed.clone(),
              t0,
              t1,
              t2,
              source.clone(),
              stage1_rebuild,
              stage2_rebuild,
              stage1.clone(),
              stage2.clone(),
              negatives,
              u_before,
              u_after,
              checker_identity(),
              verifier_identity(),
          );
          let verified = verify_bootstrap_proof_manifest(&proof, &replay)
              .expect("canonical P12 proof must independently replay");
          assert_eq!(verified.markers(), &P12_CANONICAL_MARKERS);
          for marker in verified.markers() {
              println!("{marker}");
          }

          '''
          text = text.replace(marker, replay + marker, 1)
          path.write_text(text)
          PY

          cargo fmt --all
          git add crates/formula-first-light/tests/p12_bootstrap_trust_reduction.rs
          git diff --cached --check

      - name: Commit exact integration correction
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git commit -m "test(p12): emit markers only after independent replay"
          git push origin HEAD:implementation/p12-self-hosting-bootstrap-trust-reduction
