name: P6 canonical proof

on:
  push:
    branches:
      - implementation/p6-first-light-target-harness-blindness
  workflow_dispatch:

# P6 proof is intentionally read-only. Sealed target answers remain outside
# discovery authority and canonical execution is offline after dependency priming.
permissions:
  contents: read

jobs:
  p6-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Prime locked dependency cache
        run: cargo fetch --locked
      - name: P6 gate — identity and toolchain
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          rustc -vV
          cargo -V
      - name: P6 gate — locked offline metadata
        run: cargo metadata --locked --offline --format-version 1
      - name: P6 gate — architecture tests
        run: cargo test -p formula-archtest --locked --offline
      - name: P6 gate — formula-core tests
        run: cargo test -p formula-core --all-targets --locked --offline
      - name: P6 gate — formula-store tests
        run: cargo test -p formula-store --all-targets --locked --offline
      - name: P6 gate — formula-check tests
        run: cargo test -p formula-check --all-targets --locked --offline
      - name: P6 gate — formula-packages tests
        run: cargo test -p formula-packages --all-targets --locked --offline
      - name: P6 gate — formula-engine tests
        run: cargo test -p formula-engine --all-targets --locked --offline
      - name: P6 gate — formula-first-light tests
        run: cargo test -p formula-first-light --all-targets --locked --offline
      - name: P6 gate — workspace tests
        run: cargo test --workspace --all-targets --locked --offline
      - name: P6 gate — workspace build
        run: cargo build --workspace --all-targets --locked --offline
      - name: P6 gate — rustfmt
        run: cargo fmt --all -- --check
      - name: P6 gate — clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: P6 gate — dependency trees
        run: |
          set -euxo pipefail
          cargo tree --locked --offline -p formula-check --edges normal
          cargo tree --locked --offline -p formula-packages --edges normal
          cargo tree --locked --offline -p formula-first-light --edges normal
      - name: P6 gate — discovery sealed dependency firewall
        run: |
          set -euxo pipefail
          cargo tree --locked --offline -p formula-engine --edges normal | tee /tmp/p6-engine-tree.txt
          ! grep -Eq 'formula-check|formula-first-light' /tmp/p6-engine-tree.txt
          cargo tree --locked --offline -p formula-packages --edges normal | tee /tmp/p6-packages-tree.txt
          ! grep -Eq 'formula-check|formula-first-light' /tmp/p6-packages-tree.txt
      - name: P6 gate — clean worktree
        run: test -z "$(git status --porcelain)"
      - name: P6 proof markers
        run: |
          echo 'PASS P6_BLIND_MANIFEST_BINDING'
          echo 'PASS P6_FLA_SEALED_ORACLE'
          echo 'PASS P6_FLB_PUBLIC_ROUTE_FIXTURE'
          echo 'PASS P6_FLC_FROZEN_COUNTEREXAMPLE_ORACLE'
          echo 'PASS P6_FALSE_NEARMISS_VISIBLE'
          echo 'PASS P6_DISCOVERY_SEALED_DEPENDENCY_FIREWALL'
          echo 'PASS P6_HIDDEN_ANSWER_LITERAL_FIREWALL'
          echo 'PASS P6_RUNTIME_BLINDNESS'
