name: P7 one-shot rustfmt repair

on:
  push:
    branches:
      - implementation/p7-promotion-generation-transition

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/p7-promotion-generation-transition
          fetch-depth: 0
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Prime locked dependency cache
        run: cargo fetch --locked
      - name: Apply canonical formatter under exact path allowlist
        run: |
          set -euxo pipefail
          cargo fmt --all
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 11
          for required in \
            crates/formula-check/src/promotion.rs \
            crates/formula-check/tests/p7_promotion_policy.rs \
            crates/formula-core/src/promotion.rs \
            crates/formula-core/tests/p7_promotion_identity.rs \
            crates/formula-first-light/tests/p7_fl_c_promotion.rs \
            crates/formula-packages/tests/p7_closure_delta.rs \
            crates/formula-store/src/lib.rs \
            crates/formula-store/src/promotion_store.rs \
            crates/formula-store/tests/generation_replay.rs \
            crates/formula-store/tests/p7_promotion_transaction.rs \
            tests/authority-boundary/tests/p7_promotion_authority.rs
          do
            printf '%s\n' "$changed" | grep -Fx "$required"
          done
          while IFS= read -r path; do
            case "$path" in
              crates/formula-check/src/promotion.rs|\
              crates/formula-check/tests/p7_promotion_policy.rs|\
              crates/formula-core/src/promotion.rs|\
              crates/formula-core/tests/p7_promotion_identity.rs|\
              crates/formula-first-light/tests/p7_fl_c_promotion.rs|\
              crates/formula-packages/tests/p7_closure_delta.rs|\
              crates/formula-store/src/lib.rs|\
              crates/formula-store/src/promotion_store.rs|\
              crates/formula-store/tests/generation_replay.rs|\
              crates/formula-store/tests/p7_promotion_transaction.rs|\
              tests/authority-boundary/tests/p7_promotion_authority.rs) ;;
              *) echo "refusing formatter change outside proven P7 allowlist: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          cargo fmt --all -- --check
      - name: Re-prove formatted P7 surfaces
        run: |
          set -euxo pipefail
          cargo test -p formula-core --all-targets --locked --offline
          cargo test -p formula-check --all-targets --locked --offline
          cargo test -p formula-store --all-targets --locked --offline
          cargo test -p formula-packages --all-targets --locked --offline
          cargo test -p formula-first-light --all-targets --locked --offline
          cargo test -p formula-archtest --locked --offline
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Commit only canonical formatter output
        run: |
          set -euxo pipefail
          test -z "$(git status --porcelain | awk '$1 == "??" {print}')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/formula-check/src/promotion.rs \
            crates/formula-check/tests/p7_promotion_policy.rs \
            crates/formula-core/src/promotion.rs \
            crates/formula-core/tests/p7_promotion_identity.rs \
            crates/formula-first-light/tests/p7_fl_c_promotion.rs \
            crates/formula-packages/tests/p7_closure_delta.rs \
            crates/formula-store/src/lib.rs \
            crates/formula-store/src/promotion_store.rs \
            crates/formula-store/tests/generation_replay.rs \
            crates/formula-store/tests/p7_promotion_transaction.rs \
            tests/authority-boundary/tests/p7_promotion_authority.rs
          test -z "$(git status --porcelain | awk '$1 != "M" && $1 != "M " && $1 != " M" {print}')"
          git commit -m 'style(p7): apply canonical rustfmt'
          git push origin HEAD:implementation/p7-promotion-generation-transition
