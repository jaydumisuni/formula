name: P9 core fmt once
on:
  push:
    branches: [implementation/p9-canonical-first-light-proof]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup override set 1.98.0
          cargo fmt --all
      - run: |
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add crates/formula-core/src/first_light.rs crates/formula-core/tests/p9_first_light_manifest.rs
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'style(p9): format first-light proof identities'
          git push origin HEAD:implementation/p9-canonical-first-light-proof
