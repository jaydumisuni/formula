name: P7 one-shot lock refresh

on:
  push:
    branches:
      - implementation/p7-promotion-generation-transition

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/p7-promotion-generation-transition
          fetch-depth: 0
      - name: Refresh only First-Light lock dependency metadata
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Cargo.lock')
          text = path.read_text()
          old = '''[[package]]\nname = "formula-first-light"\nversion = "0.0.1"\ndependencies = [\n "formula-core",\n "formula-engine",\n]\n'''
          new = '''[[package]]\nname = "formula-first-light"\nversion = "0.0.1"\ndependencies = [\n "formula-check",\n "formula-core",\n "formula-engine",\n "formula-store",\n "tempfile",\n]\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one formula-first-light lock entry')
          path.write_text(text.replace(old, new))
          PY
          test "$(git diff --name-only)" = "Cargo.lock"
          cargo metadata --locked --format-version 1 >/dev/null
          test "$(git diff --name-only)" = "Cargo.lock"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(p7): refresh First-Light dev dependency lock'
          git push origin HEAD:implementation/p7-promotion-generation-transition
