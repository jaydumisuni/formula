name: P0 Boundary Candidate Verification

on:
  push:
    branches:
      - impl/p0-first-light
  pull_request:

permissions:
  contents: read

jobs:
  candidate-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Verify static P0 authority boundaries
        run: python tests/authority-boundary/check_p0_boundaries.py

      - name: Verify P0 host-capture procedure syntax and safety markers
        run: |
          bash -n scripts/capture_p0_source_proof.sh
          grep -Fq 'EXPECTED_BRANCH="impl/p0-first-light"' scripts/capture_p0_source_proof.sh
          grep -Fq 'worktree is not clean' scripts/capture_p0_source_proof.sh
          grep -Fq 'expected rustc 1.98.0' scripts/capture_p0_source_proof.sh
          grep -Fq 'evidence destination already exists' scripts/capture_p0_source_proof.sh
          grep -Fq 'git merge-base --is-ancestor "$EXPECTED_ARCH" HEAD' scripts/capture_p0_source_proof.sh
          grep -Fq 'CANDIDATE_HOST_EVIDENCE_NOT_AUTHORITY' scripts/capture_p0_source_proof.sh
          ! grep -Eq '(^|[;&|[:space:]])git[[:space:]]+(merge|push)([[:space:]]|$)|--force([[:space:]=]|$)' scripts/capture_p0_source_proof.sh

      - name: Exercise atomic P0 host-capture bundle
        run: |
          git checkout -B impl/p0-first-light HEAD
          EVIDENCE="$RUNNER_TEMP/formula-p0-01-evidence"
          rm -rf "$EVIDENCE"
          bash scripts/capture_p0_source_proof.sh "$EVIDENCE"
          python scripts/verify_p0_source_proof.py --root . "$EVIDENCE"
          if bash scripts/capture_p0_source_proof.sh "$EVIDENCE"; then
            echo "capture unexpectedly overwrote an existing evidence bundle" >&2
            exit 1
          fi

      - name: Verify P0 source-proof verifier fails closed
        run: |
          python -m unittest tests/authority-boundary/test_p0_source_proof_verifier.py
          grep -Fq 'CANDIDATE_HOST_EVIDENCE_NOT_AUTHORITY' scripts/verify_p0_source_proof.py
          grep -Fq 'No Formula authority or P0 promotion is created.' scripts/verify_p0_source_proof.py

      - name: Verify formatting
        run: cargo +1.98.0 fmt --all -- --check

      - name: Verify workspace compiles with locked dependency resolution
        run: cargo +1.98.0 check --workspace --locked

      - name: Preserve authority boundary
        run: |
          echo "Candidate verification only."
          echo "This workflow does not promote P0-01, P0, or Formula mathematical authority."
