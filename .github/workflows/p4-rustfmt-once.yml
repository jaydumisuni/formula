name: P4 one-shot pinned rustfmt repair

on:
  push:
    branches:
      - implementation/p4-query-compiler-campaign-core

permissions:
  contents: write

jobs:
  rustfmt-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup override set 1.98.0
          rustfmt --version
      - name: Apply canonical rustfmt with strict scope guard
        run: |
          set -euxo pipefail
          cargo fmt --all

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            [[ "$path" == crates/* && "$path" == *.rs ]] || {
              echo "unexpected non-Rust formatter change: $path" >&2
              exit 1
            }
          done

          git diff --check
          git diff --stat
      - name: Commit formatter output and retire helper
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates
          git rm .github/workflows/p4-rustfmt-once.yml
          git commit -m 'style(p4): apply canonical rustfmt'
          git push origin HEAD:implementation/p4-query-compiler-campaign-core
