name: P10 lockfile once

on:
  push:
    branches:
      - implementation/p10-self-expansion-hardening

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: implementation/p10-self-expansion-hardening

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Regenerate lockfile for current workspace graph
        run: cargo generate-lockfile

      - name: Commit lockfile only when required
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- Cargo.lock
          test -z "$(git status --short | grep -v '^ M Cargo.lock$' || true)"
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(p10): refresh lockfile for package proof deps'
          git push origin HEAD:implementation/p10-self-expansion-hardening
