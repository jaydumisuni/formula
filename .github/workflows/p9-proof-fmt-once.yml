name: P9 proof fmt once

on:
  push:
    branches:
      - implementation/p9-canonical-first-light-proof

permissions:
  contents: write

jobs:
  fmt:
    if: "github.event.head_commit.message == 'chore(p9): add one-shot proof formatter'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup override set 1.98.0
      - name: Format canonical proof files only
        run: cargo fmt --all
      - name: Commit formatter delta
        run: |
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add tests/p9-canonical/src/lib.rs tests/p9-canonical/tests/canonical_contract.rs
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'style(p9): format canonical proof harness'
          git push origin HEAD:implementation/p9-canonical-first-light-proof
