name: P12 canonical proof

on:
  push:
    branches:
      - implementation/p12-self-hosting-bootstrap-trust-reduction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p12-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Prime locked dependency cache
        run: cargo fetch --locked

      - name: P12 gate — exact identity and toolchain
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "P12_SOURCE_SHA=${GITHUB_SHA}"
          rustc -Vv
          cargo -V

      - name: P12 gate — canonical B0 seed provenance
        run: |
          set -euxo pipefail
          rustc_sha="$(sha256sum "$(command -v rustc)" | awk '{print $1}')"
          cargo_sha="$(sha256sum "$(command -v cargo)" | awk '{print $1}')"
          toolchain_sha="$(sha256sum rust-toolchain.toml | awk '{print $1}')"
          echo "P12_RUSTC_SHA256=${rustc_sha}"
          echo "P12_CARGO_SHA256=${cargo_sha}"
          echo "P12_RUST_TOOLCHAIN_SHA256=${toolchain_sha}"
          {
            echo "P12_RUSTC_SHA256=${rustc_sha}"
            echo "P12_CARGO_SHA256=${cargo_sha}"
            echo "P12_RUST_TOOLCHAIN_SHA256=${toolchain_sha}"
          } >> "${GITHUB_ENV}"

      - name: P12 gate — locked offline metadata
        run: CARGO_NET_OFFLINE=true cargo metadata --locked --offline --format-version 1 --no-deps

      - name: P12 gate — core bootstrap identities
        run: CARGO_NET_OFFLINE=true cargo test -p formula-core --test p12_bootstrap_identity --locked --offline

      - name: P12 gate — exact workflow seed provenance parser
        run: CARGO_NET_OFFLINE=true cargo test -p formula-first-light --test p12_seed_provenance --locked --offline

      - name: P12 gate — Formula-owned bootstrap generator
        run: CARGO_NET_OFFLINE=true cargo test -p formula-realize --test p12_bootstrap_generator --locked --offline

      - name: P12 gate — independent bootstrap validator
        run: CARGO_NET_OFFLINE=true cargo test -p formula-check --test p12_bootstrap_validator --locked --offline

      - name: P12 gate — independent final bootstrap replay
        run: CARGO_NET_OFFLINE=true cargo test -p formula-check --test p12_bootstrap_verifier --locked --offline

      - name: P12 gate — separate bootstrap authority store
        run: CARGO_NET_OFFLINE=true cargo test -p formula-store --test p12_bootstrap_store --locked --offline

      - name: P12 gate — canonical T0 to T1 to T2 bootstrap proof
        run: |
          set -euxo pipefail
          CARGO_NET_OFFLINE=true cargo test -p formula-first-light --test p12_bootstrap_trust_reduction --locked --offline -- --nocapture

      - name: P12 gate — frozen P11 predecessor authority
        run: |
          set -euxo pipefail
          P11_FROZEN=6f8ce7bb6702ea1baf119aab9950aa5ba0f87283
          git merge-base --is-ancestor "${P11_FROZEN}" HEAD
          grep -F 'pub const P11_FROZEN_PROOF_HEAD: &str = "6f8ce7bb6702ea1baf119aab9950aa5ba0f87283";' crates/formula-first-light/src/p12.rs
          CARGO_NET_OFFLINE=true cargo test -p formula-first-light --test p11_federation_breadth --locked --offline
          CARGO_NET_OFFLINE=true cargo test -p formula-check --test p11_federation_verifier --locked --offline

      - name: P12 gate — predecessor architecture firewalls
        run: CARGO_NET_OFFLINE=true cargo test -p formula-archtest --all-targets --locked --offline

      - name: P12 gate — formula-core
        run: CARGO_NET_OFFLINE=true cargo test -p formula-core --all-targets --locked --offline

      - name: P12 gate — formula-check
        run: CARGO_NET_OFFLINE=true cargo test -p formula-check --all-targets --locked --offline

      - name: P12 gate — formula-store
        run: CARGO_NET_OFFLINE=true cargo test -p formula-store --all-targets --locked --offline

      - name: P12 gate — formula-realize
        run: CARGO_NET_OFFLINE=true cargo test -p formula-realize --all-targets --locked --offline

      - name: P12 gate — formula-packages
        run: CARGO_NET_OFFLINE=true cargo test -p formula-packages --all-targets --locked --offline

      - name: P12 gate — formula-engine
        run: CARGO_NET_OFFLINE=true cargo test -p formula-engine --all-targets --locked --offline

      - name: P12 gate — formula-first-light
        run: CARGO_NET_OFFLINE=true cargo test -p formula-first-light --all-targets --locked --offline

      - name: P12 gate — formula-cli
        run: CARGO_NET_OFFLINE=true cargo test -p formula-cli --all-targets --locked --offline

      - name: P12 gate — workspace tests
        run: CARGO_NET_OFFLINE=true cargo test --workspace --all-targets --locked --offline

      - name: P12 gate — workspace build
        run: CARGO_NET_OFFLINE=true cargo build --workspace --all-targets --locked --offline

      - name: P12 gate — rustfmt
        run: cargo fmt --all -- --check

      - name: P12 gate — clippy warnings denied
        run: CARGO_NET_OFFLINE=true cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: P12 gate — dependency trees
        run: |
          set -euxo pipefail
          CARGO_NET_OFFLINE=true cargo tree --locked --offline -p formula-check --edges normal
          CARGO_NET_OFFLINE=true cargo tree --locked --offline -p formula-store --edges normal
          CARGO_NET_OFFLINE=true cargo tree --locked --offline -p formula-realize --edges normal
          CARGO_NET_OFFLINE=true cargo tree --locked --offline -p formula-packages --edges normal
          CARGO_NET_OFFLINE=true cargo tree --locked --offline -p formula-engine --edges normal
          CARGO_NET_OFFLINE=true cargo tree --locked --offline -p formula-first-light --edges normal

      - name: P12 gate — authority dependency firewall
        run: |
          set -euxo pipefail
          CARGO_NET_OFFLINE=true cargo tree --locked --offline -p formula-check --edges normal | tee /tmp/p12-check-tree.txt
          ! grep -Eq 'formula-engine|formula-store|formula-realize|formula-first-light' /tmp/p12-check-tree.txt
          CARGO_NET_OFFLINE=true cargo tree --locked --offline -p formula-realize --edges normal | tee /tmp/p12-realize-tree.txt
          ! grep -Eq 'formula-check|formula-store|formula-first-light' /tmp/p12-realize-tree.txt
          CARGO_NET_OFFLINE=true cargo tree --locked --offline -p formula-engine --edges normal | tee /tmp/p12-engine-tree.txt
          ! grep -Eq 'formula-check|formula-store|formula-realize|formula-first-light' /tmp/p12-engine-tree.txt
          CARGO_NET_OFFLINE=true cargo tree --locked --offline -p formula-first-light --edges normal | tee /tmp/p12-first-light-tree.txt
          ! grep -Eq 'formula-check|formula-store|formula-realize' /tmp/p12-first-light-tree.txt

      - name: P12 gate — source authority firewall
        run: |
          set -euxo pipefail
          if grep -R -n -E 'formula_check|formula_store|formula_first_light|formula::sealed|mod[[:space:]]+sealed' \
            crates/formula-engine/src crates/formula-realize/src --include='*.rs'; then
            echo 'P12 engine/realize source authority firewall violated' >&2
            exit 1
          fi

      - name: P12 gate — clean worktree
        run: |
          set -euxo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
