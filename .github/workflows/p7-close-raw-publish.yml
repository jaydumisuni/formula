name: P7 one-shot raw publication closure

on:
  push:
    branches:
      - implementation/p7-promotion-generation-transition

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/p7-promotion-generation-transition
          fetch-depth: 0
      - name: Close raw publication surface exactly
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/formula-store/src/authority_store.rs')
          text = path.read_text()
          old = '    pub fn publish_generation(\n'
          new = '    pub(crate) fn publish_generation(\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one raw public publisher, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "crates/formula-store/src/authority_store.rs"
          grep -F 'pub(crate) fn publish_generation(' crates/formula-store/src/authority_store.rs
          ! grep -F 'pub fn publish_generation(' crates/formula-store/src/authority_store.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/formula-store/src/authority_store.rs
          git commit -m 'feat(p7): close raw public generation publisher'
          git push origin HEAD:implementation/p7-promotion-generation-transition
