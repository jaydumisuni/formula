name: P6 one-shot rustfmt repair

on:
  push:
    branches:
      - implementation/p6-first-light-target-harness-blindness

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/p6-first-light-target-harness-blindness
          fetch-depth: 0
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup override set 1.98.0
      - name: Apply formatter with strict scope guard
        run: |
          set -euxo pipefail
          cargo fmt --all
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if [ -z "$changed" ]; then
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              crates/*.rs|crates/**/*.rs|tests/authority-boundary/tests/p6_blindness.rs) ;;
              *) echo "refusing formatter change outside approved Rust scope: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates tests/authority-boundary/tests/p6_blindness.rs
          git commit -m 'style(p6): apply canonical rustfmt'
          git push origin HEAD:implementation/p6-first-light-target-harness-blindness
