name: Verifier runtime CLI capability proof

on:
  push:
    branches:
      - capability/verifier-runtime-cli
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-runtime-cli-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Prime locked dependency cache
        run: cargo fetch --locked

      - name: Runtime gate - exact identity and frozen verifier authority
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          VERIFIER_FROZEN=944d7d5c6a0094b7dd623519b6c1ff3c899188b1
          git merge-base --is-ancestor "$VERIFIER_FROZEN" HEAD
          echo "VERIFIER_RUNTIME_SOURCE_SHA=$GITHUB_SHA"
          echo "VERIFIER_FROZEN_PROOF_HEAD=$VERIFIER_FROZEN"
          rustc -Vv
          cargo -V

      - name: Runtime gate - locked offline metadata
        run: CARGO_NET_OFFLINE=true cargo metadata --locked --offline --format-version 1 --no-deps

      - name: Runtime gate - formula-cli verifier protocol
        run: CARGO_NET_OFFLINE=true cargo test -p formula-cli --test verifier_runtime --locked --offline

      - name: Runtime gate - frozen verifier equivalence
        run: CARGO_NET_OFFLINE=true cargo test -p formula-check --test verifier_equivalence --locked --offline

      - name: Runtime gate - frozen RSA public representation
        run: CARGO_NET_OFFLINE=true cargo test -p formula-check --test rsa_public_representation --locked --offline

      - name: Runtime gate - frozen modular number theory
        run: CARGO_NET_OFFLINE=true cargo test -p formula-check --test modular_number_theory --locked --offline

      - name: Runtime gate - identity output
        run: |
          set -euxo pipefail
          printf 'command=identity\n' | CARGO_NET_OFFLINE=true cargo run -q -p formula-cli --locked --offline > /tmp/formula-verifier-identity.txt
          grep -Fx 'status=pass' /tmp/formula-verifier-identity.txt
          grep -Fx 'schema=formula-verifier-runtime-v1' /tmp/formula-verifier-identity.txt
          grep -Fx 'verifier_equivalence_frozen_head=944d7d5c6a0094b7dd623519b6c1ff3c899188b1' /tmp/formula-verifier-identity.txt
          grep -Fx 'signing_supported=false' /tmp/formula-verifier-identity.txt
          grep -Fx 'authorization_generation_supported=false' /tmp/formula-verifier-identity.txt
          grep -Fx 'private_key_operations_supported=false' /tmp/formula-verifier-identity.txt

      - name: Runtime gate - full workspace tests
        run: CARGO_NET_OFFLINE=true cargo test --workspace --all-targets --locked --offline

      - name: Runtime gate - full workspace build
        run: CARGO_NET_OFFLINE=true cargo build --workspace --all-targets --locked --offline

      - name: Runtime gate - rustfmt
        run: cargo fmt --all -- --check

      - name: Runtime gate - clippy warnings denied
        run: CARGO_NET_OFFLINE=true cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Runtime gate - transport remains checker-backed
        run: |
          set -euxo pipefail
          grep -F 'check_modular_integer_result' crates/formula-cli/src/main.rs
          grep -F 'check_rsa_public_result' crates/formula-cli/src/main.rs
          grep -F 'check_montgomery_product_result' crates/formula-cli/src/main.rs
          grep -F 'check_type1_payload' crates/formula-cli/src/main.rs
          grep -F 'check_rsa_type1_payload' crates/formula-cli/src/main.rs
          ! grep -Eq 'modpow\(|modinv\(|private.?key|flash(ing)?|oem unlock|sign_signature' crates/formula-cli/src/main.rs

      - name: Runtime gate - clean worktree
        run: |
          set -euxo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
