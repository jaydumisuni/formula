name: P11 development proof

on:
  push:
    branches:
      - implementation/p11-federation-breadth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p11-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Prime locked dependency cache
        run: cargo fetch --locked

      - name: Exact identity
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: P11 targeted core identity
        run: CARGO_NET_OFFLINE=true cargo test -p formula-core --test p11_federation_identity --locked --offline

      - name: Workspace tests
        run: CARGO_NET_OFFLINE=true cargo test --workspace --all-targets --locked --offline

      - name: Workspace build
        run: CARGO_NET_OFFLINE=true cargo build --workspace --all-targets --locked --offline

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy warnings denied
        run: CARGO_NET_OFFLINE=true cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
