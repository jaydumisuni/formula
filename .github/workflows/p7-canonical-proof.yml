name: P7 canonical proof

on:
  push:
    branches:
      - implementation/p7-promotion-generation-transition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p7-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Prime locked dependency cache
        run: cargo fetch --locked
      - name: P7 gate — identity and toolchain
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          rustc -vV
          cargo -V
      - name: P7 gate — locked offline metadata
        run: cargo metadata --locked --offline --format-version 1
      - name: P7 gate — architecture tests
        run: cargo test -p formula-archtest --locked --offline
      - name: P7 gate — formula-core tests
        run: cargo test -p formula-core --all-targets --locked --offline
      - name: P7 gate — formula-store tests
        run: cargo test -p formula-store --all-targets --locked --offline
      - name: P7 gate — formula-check tests
        run: cargo test -p formula-check --all-targets --locked --offline
      - name: P7 gate — formula-packages tests
        run: cargo test -p formula-packages --all-targets --locked --offline
      - name: P7 gate — formula-engine tests
        run: cargo test -p formula-engine --all-targets --locked --offline
      - name: P7 gate — formula-first-light tests
        run: cargo test -p formula-first-light --all-targets --locked --offline
      - name: P7 gate — workspace tests
        run: cargo test --workspace --all-targets --locked --offline
      - name: P7 gate — workspace build
        run: cargo build --workspace --all-targets --locked --offline
      - name: P7 gate — rustfmt
        run: cargo fmt --all -- --check
      - name: P7 gate — clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: P7 gate — dependency trees
        run: |
          set -euxo pipefail
          cargo tree --locked --offline -p formula-store --edges normal
          cargo tree --locked --offline -p formula-check --edges normal
          cargo tree --locked --offline -p formula-engine --edges normal
          cargo tree --locked --offline -p formula-first-light --edges normal
      - name: P7 gate — authority dependency firewall
        run: |
          set -euxo pipefail
          cargo tree --locked --offline -p formula-engine --edges normal | tee /tmp/p7-engine-tree.txt
          ! grep -Eq 'formula-check|formula-store|formula-first-light' /tmp/p7-engine-tree.txt
          cargo tree --locked --offline -p formula-first-light --edges normal | tee /tmp/p7-first-light-tree.txt
          ! grep -Eq 'formula-check|formula-store' /tmp/p7-first-light-tree.txt
      - name: P7 gate — clean worktree
        run: test -z "$(git status --porcelain)"
      - name: P7 proof markers
        run: |
          echo 'PASS P7_FROZEN_BEFORE_CERTIFICATION'
          echo 'PASS P7_LIFECYCLE_STATES_DISTINCT'
          echo 'PASS P7_CHECKER_AUTHORIZATION_REQUIRED'
          echo 'PASS P7_RAW_PUBLICATION_BYPASS_CLOSED'
          echo 'PASS P7_ATOMIC_U0_TO_U1'
          echo 'PASS P7_U0_HISTORY_REPLAY_PRESERVED'
          echo 'PASS P7_PARENT_RACE_REJECTED'
          echo 'PASS P7_QUARANTINE_FAILS_CLOSED'
          echo 'PASS P7_CAPABILITY_CLOSURE_DERIVED'
          echo 'PASS P7_FLC_PRIMITIVE_ADMITTED'
          echo 'PASS P7_SEARCH_AUTHORITY_FIREWALL'
