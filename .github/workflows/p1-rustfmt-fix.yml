name: P1 rustfmt fix

on:
  push:
    branches:
      - implementation/p1-core-identity-authority-store

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/p1-core-identity-authority-store
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Apply exact rustfmt output
        run: |
          set -euxo pipefail
          rustup override set 1.98.0
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add crates/formula-core crates/formula-store
          git commit -m "style: apply pinned rustfmt to P1 implementation"
          git push origin HEAD:implementation/p1-core-identity-authority-store
