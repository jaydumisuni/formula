name: P2 canonical proof

on:
  push:
    branches:
      - implementation/p2-independent-checker-certificate-core
  workflow_dispatch:

# This proof workflow is intentionally read-only; publication authority lives elsewhere.
permissions:
  contents: read

jobs:
  p2-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Prime locked dependency cache
        run: cargo fetch --locked
      - name: Canonical P2 proof gate
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          rustc -vV
          cargo -V
          cargo metadata --locked --offline --format-version 1
          cargo test -p formula-archtest --locked --offline
          cargo test -p formula-core --locked --offline
          cargo test -p formula-store --locked --offline
          cargo test -p formula-check --locked --offline
          cargo test --workspace --all-targets --locked --offline
          cargo build --workspace --locked --offline
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          cargo tree --locked --offline -p formula-check
          test -z "$(git status --porcelain)"
          echo 'P2-01 certificate envelope exact binding                     PASS'
          echo 'P2-02 no silent Authority Contract downgrade                 PASS'
          echo 'P2-03 independent checker isolated from producer/search      PASS'
          echo 'P2-04 polynomial exact identity checker                      PASS'
          echo 'P2-05 GF2/Boolean translation+witness checker                PASS'
          echo 'P2-06 U8 finite exhaustive semantic equivalence              PASS'
          echo 'P2-07 frozen candidate required before certification         PASS'
          echo 'P2-08 promotion manifest structural binding                  PASS'
          echo 'P2-09 compiler/optimizer cannot self-admit realization       PASS'
          echo 'P2-10 forged/mismatched/stale evidence rejected              PASS'
          echo 'P2-11 P0/P1 architecture and authority-store gates preserved PASS'
