name: P7 one-shot lockfile repair

on:
  push:
    branches:
      - implementation/p7-promotion-generation-transition

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/p7-promotion-generation-transition
          fetch-depth: 0
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
      - name: Regenerate lockfile with strict scope guard
        run: |
          set -euxo pipefail
          cargo generate-lockfile
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "Cargo.lock"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build(p7): refresh lockfile after firewall correction'
          git push origin HEAD:implementation/p7-promotion-generation-transition
