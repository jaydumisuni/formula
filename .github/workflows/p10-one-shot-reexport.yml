name: P10 one-shot realization error re-export

on:
  push:
    branches:
      - implementation/p10-self-expansion-hardening
    paths:
      - .github/workflows/p10-one-shot-reexport.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Apply exact re-export patch
        run: python .github/scripts/p10_reexport_realization_error.py
      - name: Commit only authority_store re-export
        run: |
          set -euxo pipefail
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -q '^ M crates/formula-store/src/authority_store.rs$'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/formula-store/src/authority_store.rs
          git commit -m 'feat(p10): re-export realization upgrade error'
          git push
