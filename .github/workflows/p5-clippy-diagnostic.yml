name: P5 clippy diagnostic

on:
  push:
    branches:
      - diagnostic/p5-clippy-e971bb5b
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clippy-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Prime locked dependency cache
        run: cargo fetch --locked
      - name: Generate exact source correction
        run: |
          set -euxo pipefail
          python3 .github/scripts/p5_clippy_patch.py
          cargo fmt --all
          git diff --check
      - name: Verify corrected source
        run: |
          set -euxo pipefail
          cargo test -p formula-engine --all-targets --locked --offline
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Upload verified corrected sources
        uses: actions/upload-artifact@v4
        with:
          name: p5-clippy-corrected-sources
          path: |
            crates/formula-engine/src/affine_polynomial.rs
            crates/formula-engine/src/search_policy.rs
