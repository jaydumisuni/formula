name: P7 rustfmt diagnostic

on:
  push:
    branches:
      - implementation/p7-promotion-generation-transition

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup override set 1.98.0
      - name: Report canonical rustfmt changes without mutation
        run: |
          set -euxo pipefail
          cargo fmt --all
          git diff --check
          echo '=== P7_RUSTFMT_CHANGED_PATHS_BEGIN ==='
          git diff --name-only
          echo '=== P7_RUSTFMT_CHANGED_PATHS_END ==='
          echo '=== P7_RUSTFMT_DIFF_STAT ==='
          git diff --stat
          exit 1
