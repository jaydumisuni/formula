name: P5 clippy repair

on:
  push:
    branches:
      - implementation/p5-candidate-space-bounded-discovery

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Prime locked dependency cache
        run: cargo fetch --locked
      - name: Apply and verify isolated correction
        run: |
          set -euxo pipefail
          python3 .github/scripts/p5_clippy_patch.py
          cargo fmt --all
          cargo test -p formula-engine --all-targets --locked --offline
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          git diff --check
      - name: Scope guard and self-remove
        run: |
          set -euxo pipefail
          rm .github/workflows/p5-clippy-repair.yml
          rm .github/scripts/p5_clippy_patch.py
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/p5_clippy_patch.py \
            .github/workflows/p5-clippy-repair.yml \
            crates/formula-engine/src/affine_polynomial.rs \
            crates/formula-engine/src/search_policy.rs | sort)"
          test "$actual" = "$expected"
      - name: Commit verified source correction
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p5): satisfy pinned clippy without changing search authority'
          git push origin HEAD:implementation/p5-candidate-space-bounded-discovery
