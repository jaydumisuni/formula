name: P4 canonical proof

on:
  push:
    branches:
      - implementation/p4-query-compiler-campaign-core
  workflow_dispatch:

# P4 proof is intentionally read-only. Compiler/work-cell paths cannot publish authority.
# Exact-head trigger after the pinned Rust 1.98.0 formatter repair.
permissions:
  contents: read

jobs:
  p4-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Prime locked dependency cache
        run: cargo fetch --locked
      - name: P4 gate — identity and toolchain
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          rustc -vV
          cargo -V
      - name: P4 gate — locked offline metadata
        run: cargo metadata --locked --offline --format-version 1
      - name: P4 gate — architecture tests
        run: cargo test -p formula-archtest --locked --offline
      - name: P4 gate — formula-core tests
        run: cargo test -p formula-core --all-targets --locked --offline
      - name: P4 gate — formula-store tests
        run: cargo test -p formula-store --all-targets --locked --offline
      - name: P4 gate — formula-check tests
        run: cargo test -p formula-check --all-targets --locked --offline
      - name: P4 gate — formula-packages tests
        run: cargo test -p formula-packages --all-targets --locked --offline
      - name: P4 gate — formula-engine tests
        run: cargo test -p formula-engine --all-targets --locked --offline
      - name: P4 gate — workspace tests
        run: cargo test --workspace --all-targets --locked --offline
      - name: P4 gate — workspace build
        run: cargo build --workspace --all-targets --locked --offline
      - name: P4 gate — rustfmt
        run: cargo fmt --all -- --check
      - name: P4 gate — clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: P4 gate — formula-check dependency tree
        run: cargo tree --locked --offline -p formula-check --edges normal
      - name: P4 gate — formula-packages dependency tree
        run: cargo tree --locked --offline -p formula-packages --edges normal
      - name: P4 gate — formula-engine dependency tree
        run: cargo tree --locked --offline -p formula-engine --edges normal
      - name: P4 gate — clean worktree
        run: test -z "$(git status --porcelain)"
      - name: P4 proof markers
        run: |
          echo 'P4-01 QueryIR exact semantics preserved                         PASS'
          echo 'P4-02 no lossy implicit morphism                              PASS'
          echo 'P4-03 representation preservation metadata enforced          PASS'
          echo 'P4-04 reduction result classes preserved                      PASS'
          echo 'P4-05 decomposition reconstruction explicit                   PASS'
          echo 'P4-06 CampaignIR deterministic AND/OR                         PASS'
          echo 'P4-07 terminal states remain distinct                         PASS'
          echo 'P4-08 WorkCells authority-inert                               PASS'
          echo 'P4-09 replay manifest complete/deterministic                  PASS'
          echo 'P4-10 P0-P3 gates preserved                                   PASS'
