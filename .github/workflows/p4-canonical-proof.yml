name: P4 canonical proof

on:
  push:
    branches:
      - implementation/p4-query-compiler-campaign-core
  workflow_dispatch:

# P4 proof is intentionally read-only. Compiler/work-cell paths cannot publish authority.
permissions:
  contents: read

jobs:
  p4-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Prime locked dependency cache
        run: cargo fetch --locked
      - name: Canonical P4 proof gate
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          rustc -vV
          cargo -V
          cargo metadata --locked --offline --format-version 1
          cargo test -p formula-archtest --locked --offline
          cargo test -p formula-core --all-targets --locked --offline
          cargo test -p formula-store --all-targets --locked --offline
          cargo test -p formula-check --all-targets --locked --offline
          cargo test -p formula-packages --all-targets --locked --offline
          cargo test -p formula-engine --all-targets --locked --offline
          cargo test --workspace --all-targets --locked --offline
          cargo build --workspace --all-targets --locked --offline
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          cargo tree --locked --offline -p formula-check --edges normal
          cargo tree --locked --offline -p formula-packages --edges normal
          cargo tree --locked --offline -p formula-engine --edges normal
          test -z "$(git status --porcelain)"
          echo 'P4-01 QueryIR exact semantics preserved                         PASS'
          echo 'P4-02 no lossy implicit morphism                              PASS'
          echo 'P4-03 representation preservation metadata enforced          PASS'
          echo 'P4-04 reduction result classes preserved                      PASS'
          echo 'P4-05 decomposition reconstruction explicit                   PASS'
          echo 'P4-06 CampaignIR deterministic AND/OR                         PASS'
          echo 'P4-07 terminal states remain distinct                         PASS'
          echo 'P4-08 WorkCells authority-inert                               PASS'
          echo 'P4-09 replay manifest complete/deterministic                  PASS'
          echo 'P4-10 P0-P3 gates preserved                                   PASS'
