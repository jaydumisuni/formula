name: P2 one-shot pinned formatter

on:
  push:
    branches:
      - implementation/p2-independent-checker-certificate-core

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup override set 1.98.0
      - name: Apply rustfmt and prove exact path scope
        run: |
          set -euxo pipefail
          cargo fmt --all
          rm .github/workflows/p2-format-once.yml
          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/p2-format-once.yml
          crates/formula-check/src/envelope.rs
          crates/formula-check/src/gf2.rs
          crates/formula-check/tests/envelope_validation.rs
          crates/formula-check/tests/gf2_witness.rs
          crates/formula-check/tests/malicious_producer.rs
          crates/formula-check/tests/polynomial_identity.rs
          crates/formula-check/tests/promotion_manifest.rs
          crates/formula-check/tests/realization_equivalence.rs
          crates/formula-check/tests/u8_equivalence.rs
          crates/formula-core/src/certification.rs
          crates/formula-core/tests/certification_identity.rs
          EOF
          git diff --name-only | sort > /tmp/actual-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --check
      - name: Commit exact pinned formatting and retire helper
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply pinned rustfmt for P2 proof'
          git push origin HEAD:implementation/p2-independent-checker-certificate-core
