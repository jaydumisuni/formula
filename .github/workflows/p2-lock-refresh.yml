name: P2 temporary lock refresh

on:
  push:
    branches:
      - implementation/p2-independent-checker-certificate-core

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
      - name: Generate exact lockfile
        run: cargo generate-lockfile
      - name: Commit generated lockfile if changed
        run: |
          set -euxo pipefail
          git diff -- Cargo.lock
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build: refresh generated P2 lockfile'
          git push origin HEAD:implementation/p2-independent-checker-certificate-core
