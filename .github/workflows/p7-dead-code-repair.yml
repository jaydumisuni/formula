name: P7 one-shot dead-code repair

on:
  push:
    branches:
      - implementation/p7-promotion-generation-transition

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/p7-promotion-generation-transition
          fetch-depth: 0
      - name: Remove obsolete raw publication wrapper
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/formula-store/src/authority_store.rs')
          text = path.read_text()
          old = '''    pub(crate) fn publish_generation(\n        &mut self,\n        generation: &UniverseGeneration,\n    ) -> Result<ArtifactDigest, AuthorityStoreError> {\n        self.publish_generation_inner(generation, PublishFailpoint::None)\n    }\n\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one obsolete publish_generation wrapper')
          path.write_text(text.replace(old, ''))
          PY
          test "$(git diff --name-only)" = "crates/formula-store/src/authority_store.rs"
          git diff --check
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          rustup override set 1.98.0
          cargo fetch --locked
          cargo test -p formula-store --all-targets --locked --offline
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          test "$(git diff --name-only)" = "crates/formula-store/src/authority_store.rs"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/formula-store/src/authority_store.rs
          git commit -m 'refactor(p7): remove obsolete raw publication wrapper'
          git push origin HEAD:implementation/p7-promotion-generation-transition
