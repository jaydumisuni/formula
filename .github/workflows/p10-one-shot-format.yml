name: P10 one-shot canonical formatting

on:
  push:
    branches:
      - implementation/p10-self-expansion-hardening
    paths:
      - .github/workflows/p10-one-shot-format.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply pinned rustfmt
        run: cargo fmt --all
      - name: Verify formatter-only scope and commit
        run: |
          set -euxo pipefail
          git diff --name-only | sort > /tmp/actual
          cat > /tmp/allowed <<'EOF'
          crates/formula-check/src/proof_evolution.rs
          crates/formula-check/tests/p10_proof_evolution.rs
          crates/formula-engine/src/self_expansion.rs
          crates/formula-engine/tests/p10_grammar_binding.rs
          crates/formula-packages/tests/p10_activation_hardening.rs
          crates/formula-realize/tests/p10_realization_upgrade.rs
          crates/formula-store/src/authority_store/realization_store.rs
          crates/formula-store/tests/p10_realization_upgrade.rs
          EOF
          sort -o /tmp/allowed /tmp/allowed
          comm -23 /tmp/actual /tmp/allowed | tee /tmp/unexpected
          test ! -s /tmp/unexpected
          test -s /tmp/actual
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $(cat /tmp/actual)
          git commit -m 'style(p10): canonicalize tasks 5-7'
          git push
