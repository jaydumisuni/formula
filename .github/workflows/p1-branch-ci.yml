name: P1 branch TDD

on:
  push:
    branches:
      - implementation/p1-core-identity-authority-store
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-tdd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Task 1 canonical identity TDD gate
        run: cargo test -p formula-core --test canonical_identity
