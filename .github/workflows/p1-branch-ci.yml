name: P1 canonical proof

on:
  push:
    branches:
      - implementation/p1-core-identity-authority-store
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Prime locked dependency cache
        run: cargo fetch --locked
      - name: Canonical P1 proof gate
        run: |
          set -euxo pipefail
          cargo test -p formula-archtest --locked --offline
          cargo test -p formula-core --locked --offline
          cargo test -p formula-store --locked --offline
          cargo test --workspace --locked --offline
          cargo build --workspace --locked --offline
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          cargo tree --locked --offline -p formula-check
          cargo tree --locked --offline -p formula-engine
          cargo tree --locked --offline -p formula-first-light
          test -z "$(git status --porcelain)"
