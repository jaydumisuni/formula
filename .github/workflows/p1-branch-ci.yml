name: P1 branch TDD

on:
  push:
    branches:
      - implementation/p1-core-identity-authority-store
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-tdd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Task 1 canonical identity gate
        run: cargo test -p formula-core --test canonical_identity
      - name: Task 2 artifact identity gate
        run: cargo test -p formula-core --test artifact_identity
      - name: Task 3 generation identity gate
        run: cargo test -p formula-core --test generation_identity
      - name: Task 4 blob store gate
        run: cargo test -p formula-store --test blob_store
      - name: Task 5 authority publication gate
        run: cargo test -p formula-store --test generation_replay
      - name: Task 5 atomic rollback gate
        run: cargo test -p formula-store failure_
      - name: Generate exact dependency freeze candidates
        run: |
          set -euxo pipefail
          cargo generate-lockfile
          {
            cargo tree -p formula-first-light --prefix none --edges normal
            cargo tree -p formula-cli --prefix none --edges normal
          } | awk '{print $1}' | sort -u > runtime-allowlist.generated.txt
          cat runtime-allowlist.generated.txt
      - name: Upload dependency freeze candidates
        uses: actions/upload-artifact@v4
        with:
          name: p1-dependency-freeze-${{ github.sha }}
          path: |
            Cargo.lock
            runtime-allowlist.generated.txt
          if-no-files-found: error
          retention-days: 1
