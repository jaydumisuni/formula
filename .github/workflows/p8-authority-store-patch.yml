name: P8 one-shot authority-store patch

on:
  push:
    branches:
      - implementation/p8-native-realization-validation

permissions:
  contents: write

jobs:
  patch-authority-store:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact P8 authority-store surface
        run: |
          if grep -q '^mod realization_store;' crates/formula-store/src/authority_store.rs; then
            exit 0
          fi
          python3 .github/p8-authority-store-patch.py
          git diff --check
          test "$(git status --porcelain)" = ' M crates/formula-store/src/authority_store.rs'
      - name: Commit exact authority-store patch when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'THE TECH GUY Automation'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add crates/formula-store/src/authority_store.rs
          git commit -m 'feat(p8): expose authorized realization store surface'
          git push origin HEAD:implementation/p8-native-realization-validation
